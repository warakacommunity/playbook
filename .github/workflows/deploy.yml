name: Deploy preview to GitHub Pages
on:
  push: { branches: [main] }
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  # New pushes cancel any in-flight deploy so we don't queue behind a
  # stuck Pages "syncing_files" state. Latest commit always wins.
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    env:
      # Deploy the playbook project site under /playbook/ on the waraka.org
      # custom domain. The org site (warakacommunity.github.io) owns the apex
      # domain and serves the landing page.
      DOCUSAURUS_URL: https://afriplaybook.waraka.org
      DOCUSAURUS_BASE_URL: /
      # OAuth App Client ID + deployed worker URL for the "Sign in with GitHub"
      # button in the Contribute editor. GitHub forbids secret names starting
      # with GITHUB_, so the repo secrets are named without that prefix and
      # mapped to the env vars docusaurus.config.js reads.
      GITHUB_OAUTH_CLIENT_ID: ${{ secrets.OAUTH_CLIENT_ID }}
      GITHUB_OAUTH_PROXY_URL: ${{ secrets.OAUTH_PROXY_URL }}
      # Cloudflare worker URL for the model-based "Auto-translate" button in the
      # Contribute editor. Without it, docusaurus.config.js falls back to "" and
      # the editor hides the button (Google Translate still works client-side).
      TRANSLATION_PROXY_URL: ${{ secrets.TRANSLATION_PROXY_URL }}
      # Raises the GitHub API rate limit (60 → 5000/hr) so the github-contributors
      # plugin can fetch the repo's contributors for the "Thanks to our
      # Contributors" band. Without it the fetch is skipped and the band is hidden.
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # full history so inject-last-update.mjs gets real commit dates
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: yarn }
      # docs-to-pdf's Puppeteer downloads Chrome during install; cache it.
      - uses: actions/cache@v4
        with:
          path: ~/.cache/puppeteer
          key: puppeteer-${{ runner.os }}-${{ hashFiles('yarn.lock') }}
      - run: yarn install --frozen-lockfile
      # Enforce default-hide policy: chapters without `ready: true` in
      # frontmatter get `wip: true` injected, which the DocItem/Layout
      # swizzle renders as an "in development" placeholder.
      - name: Enforce default-hide draft policy
        run: bash scripts/mark-draft-chapters.sh docs
      - run: yarn build
      # The downloadable PDF is rebuilt from the site just built, on every
      # deploy, so it always matches the live pages. It is never committed.
      # Noto fonts let Chrome render Ge'ez and African Latin letters.
      - name: Install fonts for the PDF
        run: sudo apt-get update -qq && sudo apt-get install -y -qq fonts-noto-core
      - name: Generate and check PDF
        id: pdf
        continue-on-error: true
        timeout-minutes: 15
        run: yarn pdf:built && yarn pdf:check
      # A failed or broken PDF never blocks a site update and is never
      # published: keep serving the last good PDF and flag it in the run.
      - name: Keep the last good PDF if generation failed
        if: steps.pdf.outcome != 'success'
        run: |
          echo "::warning::PDF generation or check failed; keeping the currently deployed PDF."
          rm -f build/downloads/afriplaybook.pdf
          curl -fsSL -o build/downloads/afriplaybook.pdf https://afriplaybook.waraka.org/downloads/afriplaybook.pdf \
            || echo "::warning::Could not fetch the live PDF either; the PDF link will be broken until the next successful deploy."
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with: { path: build }
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      # error_count bumped from default 10 to 40 (5s poll × 40 = ~3 min
      # tolerance) to survive GitHub Pages' occasional slow syncing_files
      # phase.
      - id: deployment
        uses: actions/deploy-pages@v4
        with:
          error_count: 40
          timeout: 900000
