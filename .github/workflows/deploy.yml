name: Deploy preview to GitHub Pages
on:
  push: { branches: [main] }
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  # New pushes cancel any in-flight deploy so we don't queue behind a
  # stuck Pages "syncing_files" state. Latest commit always wins.
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    env:
      # Deploy the playbook project site under /playbook/ on the waraka.org
      # custom domain. The org site (warakacommunity.github.io) owns the apex
      # domain and serves the landing page.
      DOCUSAURUS_URL: https://waraka.org
      DOCUSAURUS_BASE_URL: /playbook/
      # OAuth App Client ID + deployed worker URL for the "Sign in with GitHub"
      # button in the Contribute editor. GitHub forbids secret names starting
      # with GITHUB_, so the repo secrets are named without that prefix and
      # mapped to the env vars docusaurus.config.js reads.
      GITHUB_OAUTH_CLIENT_ID: ${{ secrets.OAUTH_CLIENT_ID }}
      GITHUB_OAUTH_PROXY_URL: ${{ secrets.OAUTH_PROXY_URL }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # full history so inject-last-update.mjs gets real commit dates
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: yarn }
      - run: yarn install --frozen-lockfile
      # Enforce default-hide policy: chapters without `ready: true` in
      # frontmatter get `wip: true` injected, which the DocItem/Layout
      # swizzle renders as an "in development" placeholder.
      - name: Enforce default-hide draft policy
        run: bash scripts/mark-draft-chapters.sh docs
      - run: yarn build
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with: { path: build }
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      # error_count bumped from default 10 to 40 (5s poll × 40 = ~3 min
      # tolerance) to survive GitHub Pages' occasional slow syncing_files
      # phase.
      - id: deployment
        uses: actions/deploy-pages@v4
        with:
          error_count: 40
          timeout: 900000
