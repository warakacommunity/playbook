<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1130" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
  <!--
    AfriAnnotate — funder one-pager.
    Portrait A4-proportioned SVG (viewBox 800×1130). Print at any size;
    embed in decks; drops into any Google Slide / Keynote / Figma with
    lossless scaling. All numbers verified against the source report at
    docs/afrifinder/annotation-tool-comparison.md.
  -->

  <defs>
    <!-- Brand palette: coral primary + warm neutrals. Mirrors
         docs-site/src/css/custom.css. -->
    <style>
      .brand      { fill: #ff7557; }
      .brand-deep { fill: #c0353a; }
      .brand-soft { fill: #ffc3b0; }
      .ink        { fill: #1a1a1a; }
      .ink-mute   { fill: #4a4a4a; }
      .ink-soft   { fill: #7a7a7a; }
      .paper      { fill: #fdfaf7; }
      .paper-2    { fill: #f4ede4; }
      .accent-ok  { fill: #2e7d32; }
      .accent-no  { fill: #c62828; }
      .accent-mid { fill: #ef6c00; }

      text { fill: #1a1a1a; }
      .display  { font-weight: 700; letter-spacing: -0.02em; }
      .h1       { font-size: 34px; font-weight: 700; letter-spacing: -0.01em; }
      .h2       { font-size: 16px; font-weight: 700; letter-spacing: 0.06em; text-transform: uppercase; fill: #c0353a; }
      .h3       { font-size: 15px; font-weight: 700; }
      .body     { font-size: 12px; }
      .body-mute{ font-size: 12px; fill: #4a4a4a; }
      .caption  { font-size: 10px; fill: #7a7a7a; }
      .tick-ok  { font-size: 13px; font-weight: 700; fill: #2e7d32; }
      .tick-no  { font-size: 13px; font-weight: 700; fill: #c62828; }
      .tick-mid { font-size: 11px; font-weight: 600; fill: #ef6c00; }
      .num      { font-size: 44px; font-weight: 700; letter-spacing: -0.03em; fill: #c0353a; }
    </style>
  </defs>

  <!-- Page background -->
  <rect x="0" y="0" width="800" height="1130" class="paper"/>

  <!-- Header band -->
  <rect x="0" y="0" width="800" height="120" class="brand"/>
  <text x="40" y="60" class="h1" fill="#ffffff">AfriAnnotate</text>
  <text x="40" y="90" font-size="15" fill="#ffffff" opacity="0.95">
    Africa's open-source annotation platform — verified.
  </text>
  <text x="760" y="60" text-anchor="end" font-size="11" fill="#ffffff" opacity="0.85">Four rounds of adversarial</text>
  <text x="760" y="76" text-anchor="end" font-size="11" fill="#ffffff" opacity="0.85">deep research · 60+ verified claims</text>
  <text x="760" y="92" text-anchor="end" font-size="11" fill="#ffffff" opacity="0.85">docs.afriannotate.org/why-afriannotate</text>

  <!-- ══════════════════════════════════════════════════════════════
       Section 1 — The three-layer stack
  ══════════════════════════════════════════════════════════════ -->
  <text x="40" y="160" class="h2">The three-layer stack</text>

  <!-- Layer 1 — LS substrate -->
  <rect x="40" y="180" width="720" height="58" rx="6" class="paper-2"/>
  <text x="52" y="203" class="h3">Layer 1 — Label Studio substrate</text>
  <text x="52" y="222" class="body-mute">
    Declarative XML config, 6 modalities, ~119 built-in templates, Apache 2.0.
  </text>
  <rect x="620" y="188" width="128" height="18" rx="9" fill="#ffffff" stroke="#c0353a" stroke-width="1"/>
  <text x="684" y="201" text-anchor="middle" font-size="10" font-weight="600" fill="#c0353a">
    27.7k ⭐ · Apache 2.0
  </text>

  <!-- Layer 2 — Platform delta -->
  <rect x="40" y="248" width="720" height="90" rx="6" fill="#ffe8dd"/>
  <text x="52" y="271" class="h3">Layer 2 — AfriAnnotate platform delta</text>
  <text x="52" y="290" class="body-mute">RBAC · 3 auto-suspension evaluators · agreement metrics (Kappa /</text>
  <text x="52" y="305" class="body-mute">Krippendorff / Fleiss) · audio QC · label drift · dataset readiness ·</text>
  <text x="52" y="320" class="body-mute">TM+glossary+TMX CAT stack · consent snapshots · SPDX license tree ·</text>
  <text x="52" y="335" class="body-mute">cross-org pull-flow · per-project offline · Capacitor mobile · cache safety</text>

  <!-- Layer 3 — RTL wedge -->
  <rect x="40" y="348" width="720" height="86" rx="6" class="brand-soft"/>
  <text x="52" y="371" class="h3">Layer 3 — Africa-language substrate wedge</text>
  <text x="52" y="390" class="body">
    Vanilla Label Studio's RTL / non-Latin support has been publicly broken for
  </text>
  <text x="52" y="405" class="body">
    3+ years (issues #1888, #2653, #6642 — all still OPEN). Doccano's fix is
  </text>
  <text x="52" y="420" class="body">
    scope-limited to sequence-labeling. AfriAnnotate closes this at the substrate
  </text>
  <text x="52" y="431" class="body" font-weight="600">
    level — MST attr patch + ICU tokenisation + African-language template presets.
  </text>

  <!-- ══════════════════════════════════════════════════════════════
       Section 2 — Verified market outliers
  ══════════════════════════════════════════════════════════════ -->
  <text x="40" y="480" class="h2">Verified market outliers</text>
  <text x="40" y="498" class="caption">4 rounds × 60+ verified claims · every "✓" backed by primary-source URL</text>

  <!-- Card 1: Auto-suspension -->
  <g>
    <rect x="40" y="510" width="176" height="140" rx="6" class="paper-2"/>
    <rect x="40" y="510" width="176" height="6" rx="3" class="brand"/>
    <text x="52" y="536" class="num">9-0</text>
    <text x="52" y="566" class="h3">Auto-annotator</text>
    <text x="52" y="583" class="h3">suspension</text>
    <text x="52" y="605" class="body-mute">Encord + Dataloop</text>
    <text x="52" y="619" class="body-mute">+ V7 all route</text>
    <text x="52" y="633" class="body-mute">disagreement to</text>
    <text x="52" y="647" class="body-mute">manual review only.</text>
  </g>

  <!-- Card 2: License tree -->
  <g>
    <rect x="228" y="510" width="176" height="140" rx="6" class="paper-2"/>
    <rect x="228" y="510" width="176" height="6" rx="3" class="brand"/>
    <text x="240" y="536" class="num">0/22</text>
    <text x="240" y="566" class="h3">Per-project</text>
    <text x="240" y="583" class="h3">license tree</text>
    <text x="240" y="605" class="body-mute">No reviewed</text>
    <text x="240" y="619" class="body-mute">competitor documents</text>
    <text x="240" y="633" class="body-mute">SPDX license per</text>
    <text x="240" y="647" class="body-mute">project. Unique to us.</text>
  </g>

  <!-- Card 3: RTL wedge -->
  <g>
    <rect x="416" y="510" width="176" height="140" rx="6" class="paper-2"/>
    <rect x="416" y="510" width="176" height="6" rx="3" class="brand"/>
    <text x="428" y="536" class="num">3</text>
    <text x="428" y="566" class="h3">Open RTL bugs</text>
    <text x="428" y="583" class="h3">in vanilla LS</text>
    <text x="428" y="605" class="body-mute">Issues from 2022 +</text>
    <text x="428" y="619" class="body-mute">2024, unfixed. MST</text>
    <text x="428" y="633" class="body-mute">schema whitelists</text>
    <text x="428" y="647" class="body-mute">no dir attributes.</text>
  </g>

  <!-- Card 4: CAT in a general tool -->
  <g>
    <rect x="604" y="510" width="156" height="140" rx="6" class="paper-2"/>
    <rect x="604" y="510" width="156" height="6" rx="3" class="brand"/>
    <text x="616" y="536" class="num">1</text>
    <text x="616" y="566" class="h3">Full CAT</text>
    <text x="616" y="583" class="h3">stack in a</text>
    <text x="616" y="597" class="h3">general tool</text>
    <text x="616" y="619" class="body-mute">TM + glossary +</text>
    <text x="616" y="633" class="body-mute">TMX + fuzzy suggest.</text>
    <text x="616" y="647" class="body-mute">Only us.</text>
  </g>

  <!-- ══════════════════════════════════════════════════════════════
       Section 3 — Feature matrix (compact heatmap)
  ══════════════════════════════════════════════════════════════ -->
  <text x="40" y="700" class="h2">Governance features vs the reviewed set</text>
  <text x="40" y="718" class="caption">
    ✓ = primary-source verified · — = not documented · ✗ = verified absent
  </text>

  <!-- Column headers -->
  <g transform="translate(40, 736)">
    <text x="188" y="0" font-size="10" font-weight="700" fill="#4a4a4a">RBAC</text>
    <text x="248" y="0" font-size="10" font-weight="700" fill="#4a4a4a">CAT</text>
    <text x="298" y="0" font-size="10" font-weight="700" fill="#4a4a4a">Auto-susp</text>
    <text x="368" y="0" font-size="10" font-weight="700" fill="#4a4a4a">Consent</text>
    <text x="430" y="0" font-size="10" font-weight="700" fill="#4a4a4a">License</text>
    <text x="488" y="0" font-size="10" font-weight="700" fill="#4a4a4a">Cache-safe</text>
    <text x="562" y="0" font-size="10" font-weight="700" fill="#4a4a4a">Offline</text>
    <text x="618" y="0" font-size="10" font-weight="700" fill="#4a4a4a">Crowd</text>
  </g>

  <!-- Row template: label | 8 cells with ticks -->
  <!-- Row 1: AfriAnnotate — all green -->
  <g transform="translate(40, 750)">
    <rect x="0" y="0" width="720" height="24" fill="#e8f5e9"/>
    <text x="8" y="17" font-size="12" font-weight="700">AfriAnnotate</text>
    <text x="200" y="17" class="tick-ok">✓</text>
    <text x="258" y="17" class="tick-ok">✓</text>
    <text x="322" y="17" class="tick-ok">✓</text>
    <text x="384" y="17" class="tick-ok">✓</text>
    <text x="446" y="17" class="tick-ok">✓</text>
    <text x="512" y="17" class="tick-ok">✓</text>
    <text x="574" y="17" class="tick-ok">✓</text>
    <text x="628" y="17" class="tick-ok">✓</text>
  </g>

  <!-- Row 2: Vanilla LS -->
  <g transform="translate(40, 776)">
    <text x="8" y="17" class="body">Vanilla Label Studio</text>
    <text x="200" y="17" class="tick-mid">Ent.</text>
    <text x="258" y="17" class="tick-no">✗</text>
    <text x="322" y="17" class="tick-no">✗</text>
    <text x="384" y="17" class="tick-no">✗</text>
    <text x="446" y="17" class="tick-no">✗</text>
    <text x="512" y="17" class="tick-no">✗</text>
    <text x="574" y="17" class="tick-no">✗</text>
    <text x="628" y="17" class="tick-no">✗</text>
  </g>

  <!-- Row 3: Doccano -->
  <g transform="translate(40, 798)">
    <text x="8" y="17" class="body">Doccano</text>
    <text x="200" y="17" class="tick-no">—</text>
    <text x="258" y="17" class="tick-no">✗</text>
    <text x="322" y="17" class="tick-no">✗</text>
    <text x="384" y="17" class="tick-no">✗</text>
    <text x="446" y="17" class="tick-no">✗</text>
    <text x="512" y="17" class="tick-no">✗</text>
    <text x="574" y="17" class="tick-no">—</text>
    <text x="628" y="17" class="tick-no">✗</text>
  </g>

  <!-- Row 4: CVAT (Community + Online) -->
  <g transform="translate(40, 820)">
    <text x="8" y="17" class="body">CVAT (Community / Online)</text>
    <text x="200" y="17" class="tick-mid">Paid</text>
    <text x="258" y="17" class="tick-no">✗</text>
    <text x="322" y="17" class="tick-no">✗</text>
    <text x="384" y="17" class="tick-no">—</text>
    <text x="446" y="17" class="tick-no">—</text>
    <text x="512" y="17" class="tick-no">—</text>
    <text x="574" y="17" class="tick-no">✗</text>
    <text x="628" y="17" class="tick-no">—</text>
  </g>

  <!-- Row 5: Encord / Dataloop / V7 (combined line) -->
  <g transform="translate(40, 842)">
    <text x="8" y="17" class="body">Encord · Dataloop · V7 Labs</text>
    <text x="200" y="17" class="tick-ok">✓</text>
    <text x="258" y="17" class="tick-no">✗</text>
    <text x="322" y="17" class="tick-no">✗</text>
    <text x="384" y="17" class="tick-no">—</text>
    <text x="446" y="17" class="tick-no">—</text>
    <text x="512" y="17" class="tick-no">—</text>
    <text x="574" y="17" class="tick-no">✗</text>
    <text x="628" y="17" class="tick-no">—</text>
  </g>

  <!-- Row 6: Kili / Labelbox -->
  <g transform="translate(40, 864)">
    <text x="8" y="17" class="body">Kili · Labelbox</text>
    <text x="200" y="17" class="tick-ok">✓</text>
    <text x="258" y="17" class="tick-no">✗</text>
    <text x="322" y="17" class="tick-no">—</text>
    <text x="384" y="17" class="tick-no">—</text>
    <text x="446" y="17" class="tick-no">—</text>
    <text x="512" y="17" class="tick-no">—</text>
    <text x="574" y="17" class="tick-no">✗</text>
    <text x="628" y="17" class="tick-no">—</text>
  </g>

  <!-- Row 7: Prolific / MTurk / Toloka / Scale (marketplaces) -->
  <g transform="translate(40, 886)">
    <text x="8" y="17" class="body">Prolific · MTurk · Toloka · Scale</text>
    <text x="200" y="17" class="tick-mid">2-party</text>
    <text x="258" y="17" class="tick-no">✗</text>
    <text x="322" y="17" class="tick-no">✗</text>
    <text x="384" y="17" class="tick-mid">Contract</text>
    <text x="446" y="17" class="tick-no">—</text>
    <text x="512" y="17" class="tick-no">—</text>
    <text x="574" y="17" class="tick-no">✗</text>
    <text x="628" y="17" class="tick-ok">✓</text>
  </g>

  <!-- ══════════════════════════════════════════════════════════════
       Section 4 — When to use which
  ══════════════════════════════════════════════════════════════ -->
  <text x="40" y="948" class="h2">When to use which tool</text>

  <g transform="translate(40, 960)">
    <line x1="0" y1="8" x2="720" y2="8" stroke="#e0d5c8" stroke-width="1"/>
    <text x="0" y="26" class="body-mute">Deep semantic / KB-linked text annotation</text>
    <text x="720" y="26" text-anchor="end" font-size="12" font-weight="700" fill="#c0353a">INCEpTION</text>

    <line x1="0" y1="34" x2="720" y2="34" stroke="#e0d5c8" stroke-width="1"/>
    <text x="0" y="52" class="body-mute">Field-linguistic tier annotation on audio/video</text>
    <text x="720" y="52" text-anchor="end" font-size="12" font-weight="700" fill="#c0353a">ELAN</text>

    <line x1="0" y1="60" x2="720" y2="60" stroke="#e0d5c8" stroke-width="1"/>
    <text x="0" y="78" class="body-mute">Multi-modal African-language work</text>
    <text x="720" y="78" text-anchor="end" font-size="12" font-weight="700" fill="#c0353a">AfriAnnotate</text>

    <line x1="0" y1="86" x2="720" y2="86" stroke="#e0d5c8" stroke-width="1"/>
    <text x="0" y="104" class="body-mute">Translation-only with rich TM + MT post-editing</text>
    <text x="720" y="104" text-anchor="end" font-size="12" font-weight="700" fill="#c0353a">MateCat / OmegaT</text>

    <line x1="0" y1="112" x2="720" y2="112" stroke="#e0d5c8" stroke-width="1"/>
    <text x="0" y="130" class="body-mute">Computer-vision-only (bbox / polygon / 3D)</text>
    <text x="720" y="130" text-anchor="end" font-size="12" font-weight="700" fill="#c0353a">CVAT</text>

    <line x1="0" y1="138" x2="720" y2="138" stroke="#e0d5c8" stroke-width="1"/>
    <text x="0" y="156" class="body-mute">Strict data-governance + license + consent</text>
    <text x="720" y="156" text-anchor="end" font-size="12" font-weight="700" fill="#c0353a">AfriAnnotate</text>

    <line x1="0" y1="164" x2="720" y2="164" stroke="#e0d5c8" stroke-width="1"/>
    <text x="0" y="180" class="body-mute">LLM feedback / preference data (HF Hub)</text>
    <text x="720" y="180" text-anchor="end" font-size="12" font-weight="700" fill="#c0353a">Argilla 2.x</text>
    <line x1="0" y1="188" x2="720" y2="188" stroke="#e0d5c8" stroke-width="1"/>
  </g>

  <!-- Footer band -->
  <rect x="0" y="1074" width="800" height="56" class="brand-deep"/>
  <text x="40" y="1096" font-size="11" fill="#ffffff" opacity="0.9">
    Full report: docs.afriannotate.org/why-afriannotate · Report source: github.com/AfriAnnotate/Tool
  </text>
  <text x="40" y="1112" font-size="10" fill="#ffffff" opacity="0.75">
    All numbers verified against primary sources across 4 adversarial research rounds. Refuted claims documented on the don't-cite list.
  </text>
</svg>
