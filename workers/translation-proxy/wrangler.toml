name = "afriplaybook-translate"
main = "worker.js"
compatibility_date = "2024-11-01"

# Primary engine: Cloudflare Workers AI (@cf/meta/m2m100-1.2b). On-platform, so
# no external API keys and no shared-IP rate limits.
[ai]
binding = "AI"

# Non-secret values — safe to commit.
# ALLOWED_ORIGIN is a comma-separated allowlist; localhost is always allowed for
# dev. List every site this worker serves so you never have to redeploy on a move.
[vars]
ALLOWED_ORIGIN = "https://waraka.org"
# Fallback engine only (Oromo/Kinyarwanda + Workers AI outages). Cloudflare Workers
# share egress IPs, so MyMemory's anonymous per-IP quota is exhausted by other
# tenants; this email re-keys the quota to 50k words/day.
MYMEMORY_EMAIL = "afriplaybook@gmail.com"
