<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 700" width="100%" font-family="Inter,'Segoe UI',Roboto,system-ui,sans-serif" role="img" aria-labelledby="bmTitle bmDesc">
  <title id="bmTitle">Held-out benchmark stream and preference pairs</title>
  <desc id="bmDesc">Field capture splits into a training stream and a reserved benchmark stream with separate collectors, farms and speakers. A barrier between them is enforced at export by joining on source_id and speaker_id. The reserved stream feeds four task types (pest or disease ID, abiotic-stress reasoning, advisory faithfulness, safety), each case verified by an agronomist and a native speaker with adjudication by the language lead. Below, an A/B preference judgement shows two candidate advisories rated by two raters with reason codes and free text, with disagreements kept and flagged.</desc>

  <rect x="6" y="6" width="968" height="688" rx="14" fill="#FBF7F0" stroke="#E7DDCB" stroke-width="1.5"/>

  <text x="30" y="48" font-size="22" font-weight="700" fill="#2B2218">Benchmark and preference data</text>
  <text x="30" y="72" font-size="13" fill="#8A7D6E">Reserve a capture stream at month 0 &#8594; build cases in four task types &#8594; verify twice &#8594; prove disjointness at export.</text>
  <line x1="30" y1="88" x2="950" y2="88" stroke="#E7DDCB" stroke-width="1.5"/>

  <defs>
    <marker id="bmArrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#CBBBA4"/>
    </marker>
  </defs>

  <!-- ===== Field capture (terracotta) ===== -->
  <g>
    <rect x="30" y="110" width="200" height="200" rx="12" fill="#FBEDE3" stroke="#C66A3D" stroke-width="1.5"/>
    <circle cx="58" cy="140" r="13" fill="#C66A3D"/>
    <text x="58" y="145" font-size="13" font-weight="700" fill="#FFFFFF" text-anchor="middle">1</text>
    <text x="80" y="145" font-size="16" font-weight="700" fill="#9C4F2B">Field capture</text>
    <text x="48" y="172" font-size="12" fill="#8A7D6E">~10,000 field images</text>

    <rect x="48" y="184" width="164" height="50" rx="10" fill="#FFFFFF" stroke="#C66A3D" stroke-width="1.5"/>
    <text x="60" y="204" font-size="13" font-weight="600" fill="#2B2218">Training stream</text>
    <text x="60" y="222" font-size="12" fill="#8A7D6E">collectors A, farms A</text>

    <rect x="48" y="244" width="164" height="60" rx="10" fill="#FFFFFF" stroke="#1F5B3F" stroke-width="1.5"/>
    <text x="60" y="264" font-size="13" font-weight="600" fill="#1F5B3F">Reserved stream</text>
    <text x="60" y="282" font-size="12" fill="#8A7D6E">other collectors, farms,</text>
    <text x="60" y="296" font-size="12" fill="#8A7D6E">speakers</text>
  </g>

  <!-- training goes off to the left/up -->
  <line x1="212" y1="209" x2="290" y2="150" stroke="#CBBBA4" stroke-width="2" marker-end="url(#bmArrow)"/>
  <text x="296" y="146" font-size="12" fill="#8A7D6E">to training pairs</text>
  <text x="296" y="162" font-size="12" fill="#8A7D6E">and training speech</text>

  <!-- ===== Barrier (gold) ===== -->
  <g>
    <line x1="290" y1="182" x2="440" y2="182" stroke="#B97F37" stroke-width="3" stroke-dasharray="8 6"/>
    <rect x="260" y="192" width="210" height="60" rx="10" fill="#F8ECD6" stroke="#B97F37" stroke-width="1.5"/>
    <text x="365" y="212" font-size="12" font-weight="700" fill="#B97F37" text-anchor="middle">Disjoint at export</text>
    <text x="365" y="229" font-size="12" fill="#2B2218" text-anchor="middle">join on source_id + speaker_id</text>
    <text x="365" y="244" font-size="11" fill="#8A7D6E" text-anchor="middle">matches dropped, count in datasheet</text>
  </g>

  <!-- reserved -> tasks -->
  <line x1="212" y1="269" x2="500" y2="269" stroke="#CBBBA4" stroke-width="2" marker-end="url(#bmArrow)"/>
  <text x="300" y="286" font-size="11" fill="#8A7D6E">isolated at M0, cases built M3 to M5</text>

  <!-- ===== Four task types (forest green) ===== -->
  <g>
    <rect x="504" y="110" width="446" height="200" rx="12" fill="#E7F1EC" stroke="#1F5B3F" stroke-width="1.5"/>
    <circle cx="532" cy="140" r="13" fill="#1F5B3F"/>
    <text x="532" y="145" font-size="13" font-weight="700" fill="#FFFFFF" text-anchor="middle">2</text>
    <text x="554" y="145" font-size="16" font-weight="700" fill="#1F5B3F">Four task types, 200+ cases per language</text>

    <rect x="522" y="162" width="200" height="60" rx="10" fill="#FFFFFF" stroke="#2E7D5B" stroke-width="1.5"/>
    <text x="534" y="182" font-size="13" font-weight="600" fill="#1F5B3F">Pest / disease ID</text>
    <text x="534" y="199" font-size="11" fill="#8A7D6E">image, gold label,</text>
    <text x="534" y="213" font-size="11" fill="#8A7D6E">distractor labels</text>

    <rect x="732" y="162" width="200" height="60" rx="10" fill="#FFFFFF" stroke="#2E7D5B" stroke-width="1.5"/>
    <text x="744" y="182" font-size="13" font-weight="600" fill="#1F5B3F">Abiotic-stress reasoning</text>
    <text x="744" y="199" font-size="11" fill="#8A7D6E">image + weather, soil, stage;</text>
    <text x="744" y="213" font-size="11" fill="#8A7D6E">gold reasoning chain</text>

    <rect x="522" y="232" width="200" height="60" rx="10" fill="#FFFFFF" stroke="#2E7D5B" stroke-width="1.5"/>
    <text x="534" y="252" font-size="13" font-weight="600" fill="#1F5B3F">Advisory faithfulness</text>
    <text x="534" y="269" font-size="11" fill="#8A7D6E">image, diagnosis, candidate;</text>
    <text x="534" y="283" font-size="11" fill="#8A7D6E">gold verdict + rationale</text>

    <rect x="732" y="232" width="200" height="60" rx="10" fill="#FFFFFF" stroke="#2E7D5B" stroke-width="1.5"/>
    <text x="744" y="252" font-size="13" font-weight="600" fill="#1F5B3F">Safety</text>
    <text x="744" y="269" font-size="11" fill="#8A7D6E">candidate with a safety concern;</text>
    <text x="744" y="283" font-size="11" fill="#8A7D6E">gold verdict + category</text>
  </g>

  <!-- tasks -> verification -->
  <line x1="727" y1="310" x2="727" y2="340" stroke="#CBBBA4" stroke-width="2" marker-end="url(#bmArrow)"/>

  <!-- ===== Dual verification (deep rust) ===== -->
  <g>
    <rect x="504" y="342" width="446" height="92" rx="12" fill="#F3E0D8" stroke="#8A3B25" stroke-width="1.5"/>
    <circle cx="532" cy="372" r="13" fill="#8A3B25"/>
    <text x="532" y="377" font-size="13" font-weight="700" fill="#FFFFFF" text-anchor="middle">3</text>
    <text x="554" y="377" font-size="16" font-weight="700" fill="#8A3B25">Dual verification, 100% of cases</text>
    <rect x="522" y="392" width="120" height="30" rx="8" fill="#FFFFFF" stroke="#8A3B25" stroke-width="1.5"/>
    <text x="582" y="411" font-size="12" font-weight="600" fill="#2B2218" text-anchor="middle">agronomist</text>
    <text x="654" y="411" font-size="13" fill="#8A7D6E" text-anchor="middle">+</text>
    <rect x="666" y="392" width="120" height="30" rx="8" fill="#FFFFFF" stroke="#8A3B25" stroke-width="1.5"/>
    <text x="726" y="411" font-size="12" font-weight="600" fill="#2B2218" text-anchor="middle">native speaker</text>
    <text x="800" y="406" font-size="11" fill="#8A3B25">disagree &#8594;</text>
    <text x="800" y="420" font-size="11" fill="#8A3B25">language lead</text>
  </g>

  <!-- ===== Speech-input variants (small note, left) ===== -->
  <g>
    <rect x="30" y="342" width="440" height="92" rx="12" fill="#FFFFFF" stroke="#E7DDCB" stroke-width="1.5"/>
    <text x="48" y="368" font-size="14" font-weight="700" fill="#2B2218">Speech-input variants</text>
    <text x="48" y="390" font-size="12" fill="#2B2218">Case question recorded by a held-out speaker,</text>
    <text x="48" y="407" font-size="12" fill="#2B2218">for the top speech languages only.</text>
    <text x="48" y="425" font-size="11" fill="#8A7D6E">AgroLingua: 600 variants, Kiswahili, Amharic, Hausa</text>
  </g>

  <!-- ===== A/B preference (gold) ===== -->
  <text x="30" y="470" font-size="15" font-weight="700" fill="#2B2218">A/B preference pairs, double-rated</text>
  <line x1="30" y1="480" x2="950" y2="480" stroke="#E7DDCB" stroke-width="1.5"/>

  <g>
    <rect x="30" y="496" width="920" height="178" rx="12" fill="#F8ECD6" stroke="#B97F37" stroke-width="1.5"/>
    <circle cx="58" cy="526" r="13" fill="#B97F37"/>
    <text x="58" y="531" font-size="13" font-weight="700" fill="#FFFFFF" text-anchor="middle">4</text>
    <text x="80" y="531" font-size="16" font-weight="700" fill="#B97F37">Two candidates for the same pair_id</text>
    <text x="80" y="549" font-size="12" fill="#8A7D6E">from author drafts, reviewer rewrites, partner model outputs</text>

    <rect x="48" y="562" width="180" height="92" rx="10" fill="#FFFFFF" stroke="#B97F37" stroke-width="1.5"/>
    <text x="60" y="584" font-size="13" font-weight="700" fill="#B97F37">A</text>
    <text x="60" y="602" font-size="12" fill="#2B2218">advisory text</text>
    <text x="60" y="618" font-size="11" fill="#8A7D6E">source: author_draft</text>

    <rect x="244" y="562" width="180" height="92" rx="10" fill="#FFFFFF" stroke="#B97F37" stroke-width="1.5"/>
    <text x="256" y="584" font-size="13" font-weight="700" fill="#B97F37">B</text>
    <text x="256" y="602" font-size="12" fill="#2B2218">advisory text</text>
    <text x="256" y="618" font-size="11" fill="#8A7D6E">source: reviewer_rewrite</text>

    <line x1="428" y1="608" x2="470" y2="608" stroke="#CBBBA4" stroke-width="2" marker-end="url(#bmArrow)"/>

    <rect x="474" y="562" width="220" height="92" rx="10" fill="#FFFFFF" stroke="#B97F37" stroke-width="1.5"/>
    <text x="486" y="584" font-size="13" font-weight="600" fill="#2B2218">Rater 1 and rater 2, each:</text>
    <text x="486" y="602" font-size="12" fill="#2B2218">A / B / tie, strength</text>
    <text x="486" y="618" font-size="12" fill="#2B2218">reason codes from a fixed list</text>
    <text x="486" y="634" font-size="12" fill="#2B2218">+ free text</text>

    <line x1="698" y1="608" x2="740" y2="608" stroke="#CBBBA4" stroke-width="2" marker-end="url(#bmArrow)"/>

    <rect x="744" y="562" width="190" height="92" rx="10" fill="#FFFFFF" stroke="#B97F37" stroke-width="1.5"/>
    <text x="756" y="584" font-size="13" font-weight="600" fill="#2B2218">raters_agree?</text>
    <text x="756" y="602" font-size="12" fill="#1F5B3F">yes &#8594; resolved preference</text>
    <text x="756" y="618" font-size="12" fill="#8A3B25">no &#8594; kept and flagged</text>
    <text x="756" y="636" font-size="11" fill="#8A7D6E">disagreement is data</text>
  </g>

  <text x="950" y="688" font-size="12" fill="#8A7D6E" text-anchor="end">AfriPlaybook &#183; Agricultural advisory &#183; Benchmark and preference</text>
</svg>
