<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 600" role="img" aria-labelledby="t d">
  <title id="t">AfriPlaybook</title>
  <desc id="d">A baobab tree against a low ochre sun over the savanna, framed by an earth-tone kente border, in adire indigo. The word for "language" in many African languages floats in the sky, linked like a network.</desc>
  <defs>
    <clipPath id="frame"><rect width="1200" height="600" rx="18"/></clipPath>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0c1530"/>
      <stop offset=".6" stop-color="#16244a"/>
      <stop offset="1" stop-color="#2b3c66"/>
    </linearGradient>
    <radialGradient id="glow" cx="880" cy="420" r="420" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#d4a64a" stop-opacity=".28"/>
      <stop offset=".5" stop-color="#d4a64a" stop-opacity=".08"/>
      <stop offset="1" stop-color="#d4a64a" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="sun" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#e2b95e"/>
      <stop offset="1" stop-color="#b8863a"/>
    </linearGradient>
    <linearGradient id="fade" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#0c1530" stop-opacity=".85"/>
      <stop offset=".55" stop-color="#0c1530" stop-opacity="0"/>
    </linearGradient>
    <!-- Mudcloth (bògòlanfini) motif -->
    <pattern id="mud" width="48" height="48" patternUnits="userSpaceOnUse">
      <g fill="none" stroke="#efe6d3" stroke-width="2" stroke-linecap="round">
        <path d="M4 12h16M4 20h16"/>
        <path d="M30 4l12 12M42 4L30 16"/>
        <circle cx="12" cy="36" r="5"/>
        <path d="M28 32v10M34 32v10M40 32v10"/>
      </g>
    </pattern>
    <!-- Kente strip -->
    <pattern id="kente" width="96" height="36" patternUnits="userSpaceOnUse">
      <rect width="96" height="36" fill="#0c1530"/>
      <rect x="0" width="24" height="36" fill="#d4a64a"/>
      <rect x="4" y="6" width="16" height="4" fill="#2f4a7a"/>
      <rect x="4" y="16" width="16" height="4" fill="#a85a3c"/>
      <rect x="4" y="26" width="16" height="4" fill="#2f4a7a"/>
      <rect x="24" width="8" height="36" fill="#a85a3c"/>
      <rect x="32" width="24" height="36" fill="#2f4a7a"/>
      <path d="M32 0l24 18L32 36M56 0L32 18l24 18" stroke="#d4a64a" stroke-width="3" fill="none"/>
      <rect x="56" width="8" height="36" fill="#d4a64a"/>
      <rect x="64" width="24" height="36" fill="#a85a3c"/>
      <rect x="64" y="12" width="24" height="12" fill="#d4a64a"/>
      <rect x="72" y="12" width="8" height="12" fill="#0c1530"/>
      <rect x="88" width="8" height="36" fill="#2f4a7a"/>
    </pattern>
  </defs>

  <g clip-path="url(#frame)">
    <rect width="1200" height="600" fill="url(#sky)"/>
    <rect width="1200" height="600" fill="url(#glow)"/>
    <rect width="1200" height="520" fill="url(#mud)" opacity=".06"/>

    <!-- Stars -->
    <g fill="#fff">
      <circle cx="520" cy="40" r="1.4" opacity=".7"/><circle cx="610" cy="92" r="1" opacity=".6"/>
      <circle cx="1090" cy="36" r="1.6" opacity=".8"/><circle cx="1150" cy="120" r="1" opacity=".5"/>
      <circle cx="700" cy="30" r="1.2" opacity=".6"/><circle cx="455" cy="150" r="1" opacity=".5"/>
      <circle cx="980" cy="70" r="1" opacity=".6"/><circle cx="1170" cy="60" r="1.2" opacity=".5"/>
    </g>

    <!-- Sun with rings -->
    <g transform="translate(880 400)">
      <circle r="190" fill="none" stroke="#d4a64a" stroke-opacity=".12" stroke-width="2"/>
      <circle r="150" fill="none" stroke="#d4a64a" stroke-opacity=".2" stroke-width="2" stroke-dasharray="4 10"/>
      <circle r="112" fill="url(#sun)"/>
    </g>

    <!-- "Language" network in the sky -->
    <g fill="none" stroke="#c9b999" stroke-opacity=".35" stroke-width="1.2">
      <path d="M560 110L700 70L830 120L960 80L1100 130"/>
      <path d="M700 70L760 190L830 120M960 80L1030 200L1100 130"/>
      <path d="M560 110L620 220L760 190L900 230L1030 200"/>
      <path d="M1100 130L1150 240"/>
    </g>
    <g fill="#d4a64a">
      <circle cx="560" cy="110" r="4"/><circle cx="700" cy="70" r="4"/><circle cx="830" cy="120" r="4"/>
      <circle cx="960" cy="80" r="4"/><circle cx="1100" cy="130" r="4"/><circle cx="760" cy="190" r="4"/>
      <circle cx="1030" cy="200" r="4"/><circle cx="620" cy="220" r="4"/><circle cx="900" cy="230" r="4"/>
      <circle cx="1150" cy="240" r="4"/>
    </g>
    <g fill="#c9b999" font-family="'Exo 2','Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="17" opacity=".92">
      <text x="572" y="104">Harshe</text>
      <text x="712" y="64">ቋንቋ</text>
      <text x="842" y="114">Lugha</text>
      <text x="972" y="74">Èdè</text>
      <text x="1090" y="124" text-anchor="end">Asụsụ</text>
      <text x="772" y="184">Ulimi</text>
      <text x="1042" y="194">Luqad</text>
      <text x="632" y="214">Ururimi</text>
      <text x="912" y="224">Olulimi</text>
      <text x="1140" y="262" text-anchor="end">Làkk</text>
    </g>

    <!-- Distant hills -->
    <path d="M0 470Q180 430 360 455T720 440T1200 450V600H0Z" fill="#1c2b52"/>

    <!-- Acacia (small, left of baobab) -->
    <g fill="#070d1f">
      <path d="M1115 492l4-60 3 0 3 60z"/>
      <path d="M1122 436l-26-18M1122 436l28-20" stroke="#070d1f" stroke-width="3"/>
      <ellipse cx="1122" cy="410" rx="62" ry="12"/>
    </g>

    <!-- Baobab -->
    <g fill="#070d1f">
      <path d="M806 505C822 470 826 420 830 370C832 335 838 314 846 300L914 300C922 314 928 335 930 370C934 420 938 470 954 505Z"/>
      <g stroke="#070d1f" stroke-linecap="round" fill="none">
        <path d="M848 306C830 286 812 280 790 262" stroke-width="16"/>
        <path d="M790 262L770 240M790 262L772 270M800 270L792 248" stroke-width="5"/>
        <path d="M860 302C856 280 850 260 836 238" stroke-width="13"/>
        <path d="M836 238L826 214M836 238L820 236M842 250L852 228" stroke-width="5"/>
        <path d="M880 300C882 276 882 254 888 232" stroke-width="13"/>
        <path d="M888 232L880 210M888 232L900 212M886 244L872 232" stroke-width="5"/>
        <path d="M900 302C914 282 930 270 948 252" stroke-width="14"/>
        <path d="M948 252L960 232M948 252L970 256M938 262L950 244" stroke-width="5"/>
        <path d="M912 308C932 300 952 298 978 288" stroke-width="8"/>
        <path d="M978 288L996 276M978 288L994 296" stroke-width="4"/>
      </g>
    </g>

    <!-- Foreground ground -->
    <path d="M0 500Q300 488 600 498T1200 494V600H0Z" fill="#070d1f"/>
    <g stroke="#070d1f" stroke-width="2" stroke-linecap="round">
      <path d="M660 498l-4-14M664 498l2-16M668 498l6-12M1010 496l-5-13M1014 496l1-15M1018 496l6-12"/>
    </g>

    <!-- Left scrim for legibility -->
    <rect width="1200" height="600" fill="url(#fade)"/>

    <!-- Kente border -->
    <rect y="568" width="1200" height="32" fill="url(#kente)" opacity=".9"/>
    <rect y="0" width="1200" height="6" fill="url(#kente)" opacity=".9"/>

    <!-- Title block -->
    <g font-family="'Exo 2','Segoe UI','Helvetica Neue',Arial,sans-serif">
      <rect x="64" y="118" width="44" height="4" fill="#d4a64a"/>
      <text x="64" y="104" fill="#d4a64a" font-size="16" font-weight="700" letter-spacing="4">WARAKA COMMUNITY</text>
      <text x="60" y="206" fill="#f7f2e8" font-size="76" font-weight="800" letter-spacing="-1">Afri<tspan fill="#d4a64a">Playbook</tspan></text>
      <text x="64" y="256" fill="#efe6d3" font-size="24">A practical guide to building</text>
      <text x="64" y="288" fill="#efe6d3" font-size="24">high-quality datasets for African languages</text>
      <text x="64" y="352" fill="#efe6d3" fill-opacity=".75" font-size="17" font-style="italic">Built by the people who speak them.</text>
    </g>
  </g>
</svg>
